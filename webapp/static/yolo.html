<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO 实时检测</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🎥 YOLO 实时物体检测</h1>
    <nav><a href="/">← 返回 AI 文字冒险</a></nav>
  </header>
  <main class="center">
    <p class="tip">点击按钮启动摄像头，画面经本地 YOLO 推理后叠加检测框（首次需授权摄像头）</p>
    <div style="border:1px dashed #2a2f55;border-radius:12px;padding:40px;color:#8a90c9;">
      <button id="start-btn" style="font-size:16px;padding:14px 28px;cursor:pointer;">📷 启动摄像头检测</button>
      <p id="yolo-msg" style="margin-top:14px;font-size:13px;color:#7fd4ff;"></p>
    </div>
  </main>
  <script>
    document.getElementById("start-btn").onclick = async () => {
      const msg = document.getElementById("yolo-msg");
      msg.textContent = "启动中...";
      try {
        const r = await fetch("/yolo/start", { method: "POST" });
        const d = await r.json();
        msg.textContent = d.msg;
      } catch (e) {
        msg.textContent = "启动失败：" + e;
      }
    };
  </script>
</body>
</html>
